name: Testes do TCC

on:
  push:
    branches: [entrega0911]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aluguel_user
          POSTGRES_PASSWORD: test-only-db-pass
          POSTGRES_DB: aluguel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aluguel_user -d aluguel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: aluguel_user
      DB_PASSWORD: test-only-db-pass
      DB_NAME: aluguel_test
      JWT_SECRET: ci-test-secret-with-at-least-thirty-two-characters
      CORS_ORIGINS: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências da API
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Executar testes de integração
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      REACT_APP_BACKEND_URL: http://localhost:8002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências do React
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Compilar interface
        working-directory: frontend
        run: npm run build
